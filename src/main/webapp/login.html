<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login with Cookie</title>
</head>
<body>
    <h2>Đăng nhập với Cookie</h2>
    <form action="login-cookie" method="POST">
        Tên đăng nhập: <input type="text" name="username" required/><br/><br/>
        Mật khẩu: <input type="password" name="password" required/><br/><br/>
        <input type="checkbox" name="remember" value="on"/> Ghi nhớ đăng nhập<br/><br/>
        <input type="submit" value="Đăng nhập"/>
    </form>
    <hr/>
    <a href="login-session.html">Đăng nhập với Session</a>
</body>
</html>
